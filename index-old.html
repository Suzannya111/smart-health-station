<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Care 智慧醫療站</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #f0fdf4 50%, #ffffff 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --primary-green: #059669;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --danger-color: #ef4444;
      --fancy-border: linear-gradient(135deg, #38bdf8, #34d399, #0284c7);
      --btn-motor: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .fancy-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 34px 28px;
      width: 100%;
      max-width: 660px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 50px -10px rgba(2, 132, 199, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.8);
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .fancy-card::before {
      content: '';
      position: absolute;
      top: -2px; bottom: -2px; left: -2px; right: -2px;
      background: var(--fancy-border);
      border-radius: 30px;
      z-index: -1;
      opacity: 0.85;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .lang-select {
      background: white;
      border: 1.5px solid #bae6fd;
      color: var(--primary-blue);
      font-weight: 700;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 12px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    h1, h2 { margin: 0 0 8px 0; font-size: 26px; font-weight: 800; }
    p.subtitle { margin: 0 0 22px 0; color: var(--text-sub); font-size: 14px; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 18px 0 12px 0;
    }

    .btn {
      padding: 16px 16px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.15);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(2, 132, 199, 0.25); }
    .btn:active { transform: translateY(0); }

    .btn-blue { background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%); }
    .btn-green { background: linear-gradient(135deg, #059669 0%, #34d399 100%); }
    .btn-motor {
      background: var(--btn-motor);
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.25);
    }
    .btn-gray { background: #64748b; flex-direction: row; display: inline-flex; padding: 12px 24px; border-radius: 12px; }

    .map-box {
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 0 10px;
      height: 310px;
      border: 2px solid #bae6fd;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }
    .map-box iframe { width: 100%; height: 100%; border: none; }

    .temp-gauge {
      width: 190px;
      height: 190px;
      margin: 20px auto;
      border-radius: 50%;
      background: #ffffff;
      border: 6px solid #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.12);
    }
    #tempDisplay { font-size: 50px; font-weight: 800; color: #94a3b8; }

    .alert-card {
      background: #fef2f2;
      border-left: 6px solid var(--danger-color);
      padding: 16px 18px;
      border-radius: 14px;
      text-align: left;
      margin-bottom: 18px;
    }

    .canvas-box {
      max-width: 100%;
      margin: 16px auto;
      border-radius: 18px;
      overflow: hidden;
      border: 2px dashed var(--accent-cyan);
      background: #f8fafc;
    }
    canvas { max-width: 100%; height: auto; display: block; }
  </style>
</head>
<body>

  <!-- ================= 視圖 1：首頁 ================= -->
  <div class="fancy-card" id="viewHome">
    <div class="header-bar">
      <div class="badge-tag">SMART MEDICAL STATION</div>
      <select class="lang-select" onchange="setLanguage(this.value)">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </div>

    <h1 data-i18n="homeTitle">全方位智慧健康站</h1>
    <p class="subtitle" data-i18n="homeSubtitle">即時體溫檢測 • AI 傷口分流分析 • 鄰近醫療導航</p>

    <div class="btn-grid">
      <button class="btn btn-blue" onclick="showView('viewTemp')">
        <span style="font-size: 26px;">🌡️</span>
        <span data-i18n="btnNavTemp">體溫監測與退熱貼</span>
      </button>
      <button class="btn btn-green" onclick="showView('viewWound')">
        <span style="font-size: 26px;">🩹</span>
        <span data-i18n="btnNavWound">傷口 AI 智能快篩</span>
      </button>
    </div>

    <!-- 手動出貼按鈕 (透過 Wi-Fi 直接觸發) -->
    <div style="margin-bottom: 18px;">
      <button class="btn btn-motor" style="width: 100%; flex-direction: row; padding: 14px 20px;" onclick="triggerMotorCycle(this)">
        <span style="font-size: 20px;">⚡</span>
        <span data-i18n="btnManualMotor">手動出貼（馬達旋轉一圈）</span>
      </button>
    </div>

    <div style="text-align: left; font-weight: 700; font-size: 14px; color: var(--primary-blue);" data-i18n="mapTitle">
      📍 附近即時醫療與診所分佈
    </div>
    <div class="map-box">
      <iframe id="homeMapFrame" src="" loading="lazy"></iframe>
    </div>
  </div>

  <!-- ================= 視圖 2：體溫量測 ================= -->
  <div class="fancy-card" id="viewTemp" style="display: none;">
    <div class="header-bar">
      <div class="badge-tag">BLE MONITORING</div>
      <select class="lang-select" onchange="setLanguage(this.value)">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </div>

    <h2 data-i18n="tempTitle">體溫感測管理</h2>
    <p class="subtitle" id="statusTemp" data-i18n="tempStatusInit">請點擊按鈕連接體溫計</p>

    <div style="margin-bottom: 18px;">
      <button class="btn btn-blue" id="btnConnectTemp" style="display: inline-flex; flex-direction: row; padding: 12px 24px; font-size: 15px;">
        <span data-i18n="btnConnectTemp">啟動監測站 (連接體溫計)</span>
      </button>
    </div>

    <div class="temp-gauge">
      <div id="tempDisplay">--.-</div>
      <div style="font-size: 13px; font-weight: 700; color: #94a3b8; margin-top: 4px;" data-i18n="tempUnit">°C 攝氏溫度</div>
    </div>

    <p style="color: var(--text-sub); font-size: 13px; margin-bottom: 20px;" data-i18n="tempTip">
      請將體溫計對準額頭，按下按鈕直至嗶聲響起
    </p>

    <button class="btn btn-gray" onclick="showView('viewHome')" data-i18n="btnBack">返回主頁</button>
  </div>

  <!-- ================= 視圖 3：高溫警報與地圖 (預設保留 2 分鐘倒數) ================= -->
  <div class="fancy-card" id="viewAlert" style="display: none;">
    <div class="header-bar">
      <div class="badge-tag" style="background: #fee2e2; color: var(--danger-color); border-color: #fca5a5;">ALERT</div>
      <select class="lang-select" onchange="setLanguage(this.value)">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </div>

    <div class="alert-card">
      <h3 style="margin: 0 0 6px 0; color: var(--danger-color); font-size: 17px;" data-i18n="alertTitle">⚠️ 體溫超出正常標準</h3>
      <div style="font-size: 14px; line-height: 1.6; color: #334155;" data-i18n="alertMsg">
        你的體溫高於37.8度，現給你一塊退熱貼，並及早到附近的醫院或診所就診。
      </div>
    </div>

    <div id="motorStatus" style="font-weight: 700; color: var(--primary-blue); margin: 10px 0;" data-i18n="motorDispensing">
      ⚡ 指令已發送，退熱貼出貼中...
    </div>

    <div class="map-box">
      <iframe id="alertMapFrame" src="" loading="lazy"></iframe>
    </div>

    <div style="margin-top: 15px;">
      <button class="btn btn-gray" onclick="resetAndGoHome()" data-i18n="btnCloseBack">關閉並返回</button>
    </div>

    <!-- 2 分鐘 (120 秒) 動態倒數提示 -->
    <div id="alertCountdown" style="font-size: 13px; color: var(--text-sub); margin-top: 10px; font-weight: 600;">
      系統將於 120 秒後自動返回主頁
    </div>
  </div>

  <!-- ================= 視圖 4：傷口分析 ================= -->
  <div class="fancy-card" id="viewWound" style="display: none;">
    <div class="header-bar">
      <div class="badge-tag">AI STATION</div>
      <select class="lang-select" onchange="setLanguage(this.value)">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </div>

    <h2 data-i18n="woundTitle">傷口快速分流辨識</h2>
    <p class="subtitle" data-i18n="woundSubtitle">拍攝患部照片，AI 將自動分流傷口種類</p>

    <div class="canvas-box">
      <canvas id="woundCanvas" style="min-height: 150px; background: #f1f5f9; width: 100%;"></canvas>
    </div>

    <div style="margin: 18px 0 12px 0;">
      <button class="btn btn-motor" style="width: 100%; flex-direction: row; padding: 14px 20px;" onclick="triggerMotorCycle(this)">
        <span style="font-size: 20px;">⚡</span>
        <span data-i18n="btnManualMotor">手動出貼（馬達旋轉一圈）</span>
      </button>
    </div>

    <div>
      <button class="btn btn-gray" onclick="showView('viewHome')" data-i18n="btnBack">返回主頁</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // ⚙️ 系統設定參數
    // =========================================================================
    const ESP32_IP = "192.168.1.100"; // 👈 請確認此 IP 是否與你的 ESP32 相同

    const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
    const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

    const I18N = {
      'zh-Hant': {
        homeTitle: "全方位智慧健康站",
        homeSubtitle: "即時體溫檢測 • AI 傷口分流分析 • 鄰近醫療導航",
        btnNavTemp: "體溫監測與退熱貼",
        btnNavWound: "傷口 AI 智能快篩",
        btnManualMotor: "手動出貼（馬達旋轉一圈）",
        motorRotating: "馬達轉動中...",
        mapTitle: "📍 附近即時醫療與診所分佈",
        tempTitle: "體溫感測管理",
        tempStatusInit: "請點擊按鈕連接體溫計",
        tempStatusConnected: "體溫計已連線 ✓ 請按下測量鍵",
        btnConnectTemp: "啟動監測站 (連接體溫計)",
        tempUnit: "°C 攝氏溫度",
        tempTip: "請將體溫計對準額頭，按下按鈕直至嗶聲響起",
        btnBack: "返回主頁",
        alertTitle: "⚠️ 體溫超出正常標準",
        alertMsg: "你的體溫高於37.8度，現給你一塊退熱貼，並及早到附近的醫院或診所就診。",
        motorDispensing: "⚡ 指令已發送，退熱貼出貼中...",
        btnCloseBack: "關閉並返回",
        alertCountdownPrefix: "系統將於 ",
        alertCountdownSuffix: " 秒後自動返回主頁",
        woundTitle: "傷口快速分流辨識",
        woundSubtitle: "拍攝患部照片，AI 將自動分流傷口種類",
        mapQuery: "醫院+診所"
      },
      'zh-Hans': {
        homeTitle: "全方位智慧健康站",
        homeSubtitle: "实时体温检测 • AI 伤口分流分析 • 邻近医疗导航",
        btnNavTemp: "体温监测与退热贴",
        btnNavWound: "伤口 AI 智能快筛",
        btnManualMotor: "手动出贴（马达旋转一圈）",
        motorRotating: "马达转动中...",
        mapTitle: "📍 附近即时医疗与诊所分布",
        tempTitle: "体温感测管理",
        tempStatusInit: "请点击按钮连接体温计",
        tempStatusConnected: "体温计已连线 ✓ 请按下测量键",
        btnConnectTemp: "启动监测站 (连接体温计)",
        tempUnit: "°C 摄氏温度",
        tempTip: "请将体温计对准额头，按下按钮直至哔声响起",
        btnBack: "返回主页",
        alertTitle: "⚠️ 体温超出正常标准",
        alertMsg: "你的体温高于37.8度，现给你一块退热贴，并及早到附近的医院或诊所就诊。",
        motorDispensing: "⚡ 指令已发送，退热贴出贴中...",
        btnCloseBack: "关闭并返回",
        alertCountdownPrefix: "系统将于 ",
        alertCountdownSuffix: " 秒后自动返回主页",
        woundTitle: "伤口快速分流辨识",
        woundSubtitle: "拍摄患部照片，AI 将自动分流伤口种类",
        mapQuery: "医院+诊所"
      },
      'en': {
        homeTitle: "Smart Healthcare Station",
        homeSubtitle: "Real-time Body Temp • AI Wound Triage • Nearby Navigation",
        btnNavTemp: "Temp Monitor & Patch",
        btnNavWound: "AI Wound Screening",
        btnManualMotor: "Dispense Patch (Rotate 1 Cycle)",
        motorRotating: "Rotating Motor...",
        mapTitle: "📍 Nearby Medical Facilities & Clinics",
        tempTitle: "Temperature Monitor",
        tempStatusInit: "Please connect thermometer",
        tempStatusConnected: "Thermometer connected ✓ Press measure button",
        btnConnectTemp: "Start Station (Connect Thermometer)",
        tempUnit: "°C Celsius",
        tempTip: "Aim thermometer at forehead and press until beep sounds",
        btnBack: "Back to Home",
        alertTitle: "⚠️ Temperature Above Normal",
        alertMsg: "Your temperature is above 37.8°C. A cooling patch has been dispensed. Please visit a nearby clinic or hospital promptly.",
        motorDispensing: "⚡ Signal sent, dispensing patch...",
        btnCloseBack: "Close and Return",
        alertCountdownPrefix: "Returning to home in ",
        alertCountdownSuffix: " seconds...",
        woundTitle: "Wound AI Triage & Analysis",
        woundSubtitle: "Capture affected area, AI will classify and triage",
        mapQuery: "hospital+clinic"
      },
      'pt': {
        homeTitle: "Posto de Saúde Inteligente",
        homeSubtitle: "Medição de Temp. • Triagem IA de Feridas • Navegação Médica",
        btnNavTemp: "Monitor de Temp. e Adesivo",
        btnNavWound: "Triagem Inteligente de Feridas",
        btnManualMotor: "Dispensar Adesivo (Girar 1 Volta)",
        motorRotating: "Motor a girar...",
        mapTitle: "📍 Clínicas e Hospitais nas Proximidades",
        tempTitle: "Gestão de Temperatura",
        tempStatusInit: "Ligue o termómetro",
        tempStatusConnected: "Termómetro ligado ✓ Prima para medir",
        btnConnectTemp: "Iniciar Estação (Ligar Termómetro)",
        tempUnit: "°C Graus Celsius",
        tempTip: "Aponte para a testa e prima até ouvir o sinal sonoro",
        btnBack: "Voltar ao Início",
        alertTitle: "⚠️ Temperatura Acima do Normal",
        alertMsg: "A sua temperatura está acima de 37.8°C. Foi fornecido um adesivo refrescante. Por favor, consulte um médico com brevidade.",
        motorDispensing: "⚡ Sinal enviado, a libertar adesivo...",
        btnCloseBack: "Fechar e Voltar",
        alertCountdownPrefix: "A regressar ao início em ",
        alertCountdownSuffix: " segundos...",
        woundTitle: "Triagem Rápida de Feridas",
        woundSubtitle: "Fotografe a lesão para classificação automática por IA",
        mapQuery: "hospital+clinica"
      }
    };

    let currentLang = localStorage.getItem('smart_care_lang') || 'zh-Hant';
    let currentCoords = null;
    let alertTimer = null;
    let remainingSeconds = 120; // 2 分鐘倒數

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('smart_care_lang', lang);
      document.querySelectorAll('.lang-select').forEach(sel => sel.value = lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang] && I18N[lang][key]) el.textContent = I18N[lang][key];
      });
      updateCountdownDisplay();
      updateMaps();
    }

    function showView(targetId) {
      ['viewHome', 'viewTemp', 'viewAlert', 'viewWound'].forEach(id => {
        document.getElementById(id).style.display = (id === targetId) ? 'block' : 'none';
      });
    }

    // 重置並返回主頁 (同時清除 2 分鐘定時器)
    function resetAndGoHome() {
      if (alertTimer) {
        clearInterval(alertTimer);
        alertTimer = null;
      }
      document.getElementById('tempDisplay').textContent = '--.-';
      document.getElementById('tempDisplay').style.color = '#94a3b8';
      showView('viewHome');
    }

    function updateCountdownDisplay() {
      const countdownEl = document.getElementById('alertCountdown');
      if (countdownEl) {
        const prefix = I18N[currentLang]?.alertCountdownPrefix || "系統將於 ";
        const suffix = I18N[currentLang]?.alertCountdownSuffix || " 秒後自動返回主頁";
        countdownEl.textContent = `${prefix}${remainingSeconds}${suffix}`;
      }
    }

    // 核心：發送 Wi-Fi 出貼指令
    function sendDropSignal() {
      fetch(`http://${ESP32_IP}/drop`, { mode: 'no-cors' })
        .then(() => console.log('已向 ESP32 發送出貼指令'))
        .catch(err => console.error('ESP32 Wi-Fi 連線錯誤:', err));
    }

    // 手動出貼按鈕
    function triggerMotorCycle(buttonElement) {
      sendDropSignal();
      if (buttonElement) {
        const originalHTML = buttonElement.innerHTML;
        buttonElement.innerHTML = `<span style="font-size: 20px;">🔄</span> <span>${I18N[currentLang].motorRotating}</span>`;
        buttonElement.style.opacity = '0.7';
        buttonElement.disabled = true;

        setTimeout(() => {
          buttonElement.innerHTML = originalHTML;
          buttonElement.style.opacity = '1';
          buttonElement.disabled = false;
        }, 3500);
      }
    }

    // 體溫異常警報 (啟動 2 分鐘 = 120 秒倒數計時)
    function triggerFeverResponse() {
      showView('viewAlert');
      sendDropSignal();

      // 重設倒數為 120 秒
      if (alertTimer) clearInterval(alertTimer);
      remainingSeconds = 120;
      updateCountdownDisplay();

      alertTimer = setInterval(() => {
        remainingSeconds--;
        updateCountdownDisplay();
        if (remainingSeconds <= 0) {
          clearInterval(alertTimer);
          alertTimer = null;
          resetAndGoHome();
        }
      }, 1000);
    }

    // 連接體溫計 (AOJ-20A)
    document.getElementById('btnConnectTemp').addEventListener('click', async () => {
      try {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(CHARACTERISTIC_UUID);
        
        char.addEventListener('characteristicvaluechanged', e => {
          const bytes = new Uint8Array(e.target.value.buffer);
          if (bytes.length >= 6 && bytes[0] === 0xAA && bytes[2] === 0xC1) {
            const temp = ((bytes[4] << 8) | bytes[5]) / 100.0;
            if (temp >= 30.0 && temp <= 45.0) {
              const display = document.getElementById('tempDisplay');
              display.textContent = temp.toFixed(1);
              if (temp > 37.8) {
                display.style.color = 'var(--danger-color)';
                triggerFeverResponse();
              } else {
                display.style.color = 'var(--primary-green)';
              }
            }
          }
        });

        await char.startNotifications();
        document.getElementById('statusTemp').textContent = I18N[currentLang].tempStatusConnected;
        document.getElementById('btnConnectTemp').style.display = 'none';
      } catch (err) {
        alert('體溫計連線失敗: ' + err.message);
      }
    });

    // 定位與地圖
    function updateMaps() {
      const q = I18N[currentLang]?.mapQuery || "醫院+診所";
      if (currentCoords) {
        const url = `https://maps.google.com/maps?q=${encodeURIComponent(q)}&ll=${currentCoords.latitude},${currentCoords.longitude}&z=14&output=embed`;
        document.getElementById('homeMapFrame').src = url;
        document.getElementById('alertMapFrame').src = url;
      } else {
        const fallback = `https://maps.google.com/maps?q=${encodeURIComponent(q)}&output=embed`;
        document.getElementById('homeMapFrame').src = fallback;
        document.getElementById('alertMapFrame').src = fallback;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setLanguage(currentLang);
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            currentCoords = pos.coords;
            updateMaps();
          },
          () => { updateMaps(); }
        );
      }
    });
  </script>
</body>
</html>
